name: CI - Run Tests
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        working-directory: ./my-react-app
        run: npm install
      - name: Run tests
        working-directory: ./my-react-app
        run: npm test -- --watchAll=false